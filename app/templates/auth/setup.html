{% extends 'base.html' %}{% block content %}
<div class="card p-4"><h3>Setup Administrator Pertama</h3><p class="text-muted">Buat username dan password administrator Anda sendiri. Setup akan terkunci setelah akun dibuat. Tidak ada password bawaan.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label">Username</label><input class="form-control" name="username" required minlength="3"></div>
<div class="mb-3"><label class="form-label">Password (min 6)</label><input type="password" class="form-control" name="password" required minlength="6"></div>
<div class="mb-3"><label class="form-label">Konfirmasi Password</label><input type="password" class="form-control" name="confirm_password" required></div>
<button class="btn btn-primary w-100">Buat Akun Administrator</button></form></div>{% endblock %}
